global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'ai-financial-advisor'
    environment: 'development'

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: '/metrics'

  - job_name: 'agent-service'
    static_configs:
      - targets: ['agent-service:8002']
    metrics_path: '/metrics'

  - job_name: 'rag-service'
    static_configs:
      - targets: ['rag-service:8003']
    metrics_path: '/metrics'

  - job_name: 'market-data-service'
    static_configs:
      - targets: ['market-data-service:8004']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']