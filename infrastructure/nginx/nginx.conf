events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ─── Rate Limiting Zones ────────────────────────────────
    # Strict 30 req/min limit for Auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    # 60 req/min limit for General APIs
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;

    # ─── Upstream Microservices ─────────────────────────────
    upstream auth_service {
        server auth-service:8001;
        keepalive 16;
    }

    upstream agent_service {
        server agent-service:8002;
        keepalive 16;
    }

    upstream rag_service {
        server rag-service:8003;
        keepalive 16;
    }

    upstream market_data_service {
        server market-data-service:8004;
        keepalive 16;
    }

    # ─── Server Router ──────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Nginx Gateway Health Check
        location /health {
            return 200 '{"status":"healthy","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Auth Service Routes ──────────────────────────────
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
        }

        # ── Agent Service Routes (With WebSocket support) ────
        location /api/v1/chat {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://agent_service;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # WebSocket headers
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── RAG Knowledge Service Routes ────────────────────
        location /api/v1/knowledge {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://rag_service;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
            client_max_body_size 20M;          # Allow PDF uploads
        }

        # ── Market Data Service Routes ──────────────────────
        location /api/v1/market {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://market_data_service;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
        }

        # ── 404 Fallback ────────────────────────────────────
        location / {
            return 404 '{"detail":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}