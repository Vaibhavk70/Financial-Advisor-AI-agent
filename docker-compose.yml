# ════════════════════════════════════════════════════════════
#   AI Financial Advisor — Docker Compose (Development)
# ════════════════════════════════════════════════════════════

services:

  # ─── INFRASTRUCTURE ──────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: financeai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-financeai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeai} -d ${POSTGRES_DB:-financeai_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financeai_network

  redis:
    image: redis:7-alpine
    container_name: financeai_redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeai_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: financeai_chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: ""
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financeai_network

  ollama:
    image: ollama/ollama:latest
    container_name: financeai_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # ── GPU Support: uncomment if you have NVIDIA GPU ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - financeai_network

  # ─── APPLICATION SERVICES ─────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: development
    container_name: financeai_auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DEBUG: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth-service:/app # Hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - financeai_network

  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
      target: development
    container_name: financeai_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_HOST: chromadb
      RAG_SERVICE_URL: http://rag-service:8003
      MARKET_DATA_SERVICE_URL: http://market-data-service:8004
      DEBUG: "true"
    ports:
      - "8002:8002"
    volumes:
      - ./services/agent-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - financeai_network

  rag-service:
    build:
      context: ./services/rag-service
      dockerfile: Dockerfile
      target: development
    container_name: financeai_rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      DEBUG: "true"
    ports:
      - "8003:8003"
    volumes:
      - ./services/rag-service:/app
      - rag_documents:/app/documents
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - financeai_network

  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
      target: development
    container_name: financeai_market
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DEBUG: "true"
    ports:
      - "8004:8004"
    volumes:
      - ./services/market-data-service:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - financeai_network

  nginx:
    image: nginx:alpine
    container_name: financeai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - financeai_network

  # ─── OBSERVABILITY (optional — use: make monitoring-up) ──

  prometheus:
    image: prom/prometheus:latest
    container_name: financeai_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - financeai_network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: financeai_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - financeai_network
    profiles:
      - monitoring

# ─── VOLUMES ─────────────────────────────────────────────────

volumes:
  postgres_data:
    name: financeai_postgres_data
  redis_data:
    name: financeai_redis_data
  chroma_data:
    name: financeai_chroma_data
  ollama_data:
    name: financeai_ollama_data
  rag_documents:
    name: financeai_rag_documents
  prometheus_data:
    name: financeai_prometheus_data
  grafana_data:
    name: financeai_grafana_data

# ─── NETWORKS ────────────────────────────────────────────────

networks:
  financeai_network:
    driver: bridge
    name: financeai_network
